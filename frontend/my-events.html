<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYAVASTHA — My Event</title>
<link rel="icon" type="image/png" href="/assets/vyavastha-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      bg: "#F5FAFF", panel: "#FFFFFF", surface: "#FFFFFF", border: "#E7EEF7",
      muted: "#64748B", ink: "#123B6D", accent: "#1976D2", accentDim: "#123B6D",
      green: "#20C997", greenLight: "#5BE7A9", warn: "#F59E0B", ok: "#22C55E", high: "#F87171", danger: "#DC2626",
      pastelBlue: "#E4F1FF", pastelGreen: "#DFFBF1",
    }, fontFamily: { sans: ["Manrope","system-ui","sans-serif"], mono: ["JetBrains Mono","ui-monospace","monospace"] } } },
  };
</script>
<style>
  body{ background: radial-gradient(circle at 10% 5%, rgba(25,118,210,.06), transparent 45%), radial-gradient(circle at 90% 90%, rgba(32,201,151,.07), transparent 45%), #F5FAFF; }
  .brand-mark{ background:linear-gradient(90deg,#123B6D,#20C997); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .eyebrow{ font-size:11px; font-weight:800; letter-spacing:.14em; color:#123B6D; }
  .card{ background:#FFFFFF; border:1px solid #E7EEF7; border-radius:16px; box-shadow:0 2px 8px rgba(18,59,109,.04); transition:.2s; }
  .card:hover{ transform:translateY(-3px); box-shadow:0 10px 22px rgba(18,59,109,.1); }
  .top-nav{ position:sticky; top:0; z-index:40; background:rgba(245,250,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid #E7EEF7; }
  .nav-link{ font-size:13px; font-weight:700; color:#64748B; text-decoration:none; padding:8px 14px; border-radius:10px; transition:.15s; }
  .nav-link:hover{ background:#E4F1FF; color:#1976D2; }
  .nav-link.active{ background:#1976D2; color:#fff; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .fade-up{ animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  .tab-btn{ padding:9px 18px; font-size:13px; font-weight:800; color:#64748B; border-radius:20px; cursor:pointer; transition:.15s; }
  .tab-btn.active{ background:#123B6D; color:#fff; }
  .tab-btn:not(.active):hover{ background:#E4F1FF; color:#1976D2; }
  .live-pill{ font-size:9px; font-weight:800; letter-spacing:.06em; color:#fff; background:#22C55E; border-radius:20px; padding:2px 8px; }
  .checked-pill{ font-size:9px; font-weight:800; letter-spacing:.04em; color:#20C997; }
  .qr-btn{ background:#E4F1FF; color:#123B6D; font-weight:700; transition:.15s; }
  .qr-btn:hover{ background:#1976D2; color:#fff; }
  .modal-veil{ position:fixed; inset:0; background:rgba(18,59,109,.5); backdrop-filter:blur(2px); z-index:60; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-veil.show{ display:flex; animation: veilIn .2s ease both; }
  @keyframes veilIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal-box{ width:100%; max-width:22rem; background:#FFFFFF; border-radius:20px; padding:24px; text-align:center; animation: sheetIn .25s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sheetIn{ from{ opacity:0; transform:scale(.94); } to{ opacity:1; transform:scale(1); } }
</style>
</head>
<body class="bg-bg text-ink font-sans m-0 min-h-screen pb-16">

<nav class="top-nav">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-3 flex items-center justify-between">
    <a href="events.html" class="flex items-center gap-2.5 no-underline">
      <img src="/assets/vyavastha-icon.png" alt="VYAVASTHA" class="w-9 h-9 rounded-lg" />
      <span class="brand-mark text-lg font-extrabold tracking-[0.02em]">VYAVASTHA</span>
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="events.html" class="nav-link">Home</a>
      <a href="events.html?explore=1" class="nav-link">Explore</a>
      <a href="my-events.html" class="nav-link active">My Event</a>
      <a href="notifications.html" class="nav-link">Alerts</a>
    </div>
    <a href="profile.html" class="w-9 h-9 rounded-full flex items-center justify-center text-lg" style="background:#E4F1FF;">👤</a>
  </div>
</nav>

<header class="max-w-7xl mx-auto px-6 lg:px-10 pt-8 fade-up">
  <h1 class="text-2xl font-extrabold m-0">My Event</h1>
  <p class="text-muted text-sm mt-1">Everything about your bookings, in one place.</p>
</header>

<div id="noemail" class="max-w-md mx-auto mt-8 card p-5 hidden fade-up">
  <p class="text-sm mb-2">Sign in to see your bookings.</p>
  <input type="email" id="email-input" placeholder="you@example.com" class="w-full p-2.5 text-sm mb-2" style="border:1px solid #E7EEF7;border-radius:10px;" />
  <button class="w-full p-2.5 rounded-lg text-xs font-bold" style="background:#1976D2;color:#fff;" onclick="saveEmail()">CONTINUE</button>
</div>

<div id="body-view" class="max-w-7xl mx-auto px-6 lg:px-10 hidden">
  <div class="flex gap-2 mt-6 fade-up" style="animation-delay:.05s">
    <div class="tab-btn active" data-tab="upcoming" onclick="switchTab(this)">Upcoming</div>
    <div class="tab-btn" data-tab="active" onclick="switchTab(this)">Active</div>
    <div class="tab-btn" data-tab="past" onclick="switchTab(this)">Past</div>
  </div>
  <section id="bookings-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-6"></section>

  <section id="live-crowd-box" class="card p-4 mt-6 hidden fade-up"></section>

  <section id="live-info" class="mt-6 hidden fade-up">
    <section class="card p-5 mb-5">
      <h2 class="eyebrow mb-3">🗺️ Inside the venue — accessibility &amp; emergency exits</h2>
      <label class="flex items-center gap-2 text-sm mb-3">
        <input type="checkbox" id="accessible-toggle" onchange="onAccessibleToggle()" />
        I need a wheelchair-accessible exit
      </label>
      <div id="evac-status" class="text-sm"></div>
    </section>
    <section class="card p-5 mb-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="eyebrow">🏨 More hotels near the venue</h2>
        <button class="qr-btn px-3 py-1.5 rounded-lg text-[10px]" onclick="loadUserHotels(liveEventId)">REFRESH</button>
      </div>
      <div id="user-hotels" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>
    <section class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="eyebrow">🚌 City transport (not event-specific)</h2>
        <button class="qr-btn px-3 py-1.5 rounded-lg text-[10px]" onclick="loadUserTransport(liveEventId)">REFRESH</button>
      </div>
      <div id="user-transport" class="text-sm"></div>
    </section>
  </section>

  <section id="notif-box" class="card p-4 mt-6 hidden fade-up"></section>
</div>

<div class="modal-veil" id="qr-veil" onclick="if(event.target===this) closeQr()">
  <div class="modal-box">
    <div id="qr-code" class="flex items-center justify-center mb-3"></div>
    <div id="qr-code-text" class="text-xl tracking-[4px] font-mono font-bold text-accent"></div>
    <button class="mt-4 text-muted text-xs font-bold uppercase" onclick="closeQr()">Close</button>
  </div>
</div>

<script>
const API = "";
async function api(path, opts) { const res = await fetch(API + path, opts); return res.json(); }
let bookingsData = { upcoming: [], active: [], past: [] };
let activeTab = "upcoming";
let plansByCode = {};
let notifs = [];
let anyLiveActive = false;
let liveEventId = null;
let cachedLocation = null, locationRequested = false;
const LEVEL_HEX = { LOW: "#22C55E", MODERATE: "#F59E0B", HIGH: "#F87171", CRITICAL: "#DC2626" };
// Attendee-friendly words instead of raw risk-engine terminology — the
// underlying level/number is unchanged, only the label shown is translated.
const LEVEL_LABEL = { LOW: "Quiet", MODERATE: "Moderate crowd", HIGH: "Busy", CRITICAL: "Very busy" };
const NOTIF_ICON = { CRITICAL: "🔴", HIGH: "🟠", MEDIUM: "🟡", LOW: "🟢" };

function getEmail() { try { return sessionStorage.getItem("vyavastha_email") || ""; } catch (e) { return ""; } }
function saveEmail() {
  const v = document.getElementById("email-input").value.trim();
  if (!v) return;
  try { sessionStorage.setItem("vyavastha_email", v); } catch (e) {}
  load();
}

function switchTab(el) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  activeTab = el.dataset.tab;
  render();
}

function bookingCard(b, i) {
  return `
    <div class="card p-5 fade-up" style="animation-delay:${Math.min(i * 0.05, 0.3)}s">
      <div class="flex items-center justify-between">
        <div class="font-bold text-sm">${b.event_name}</div>
        ${b.checked_in ? '<span class="checked-pill">✓ CHECKED IN</span>' : ""}
      </div>
      <div class="text-muted text-[10.5px] font-mono mt-1">${b.event_date ? new Date(b.event_date).toDateString() : "Date TBA"}</div>
      <div class="text-muted text-[10.5px]">${b.venue_name || ""}</div>
      <div class="flex items-center justify-between mt-2 text-xs">
        <span>${b.tier_name}${b.seat_label ? " · Seat " + b.seat_label : ""}${b.quantity > 1 ? " · Qty " + b.quantity : ""}</span>
        <span class="text-muted font-mono">${b.gate_name || ""}</span>
      </div>
      ${b.hotel_name ? `<div class="text-[10.5px] text-muted mt-1">🏨 ${b.hotel_name}</div>` : ""}
      ${b.wants_transport ? `<div class="text-[10.5px] text-muted mt-1">🚌 Transport requested</div>` : ""}
      <button class="qr-btn w-full mt-3 py-2 rounded-lg text-xs" onclick='showQr(${JSON.stringify(b.code)})'>VIEW QR CODE — ${b.code}</button>
      ${activeTab === "active" ? planBlockHtml(plansByCode[b.code]) : ""}
    </div>`;
}

function planBlockHtml(plan) {
  if (!plan || !plan.is_live) return "";
  const navLink = (lat, lng) => lat != null && lng != null
    ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" rel="noopener" class="text-accent text-[10px] font-bold no-underline">🧭 Navigate</a>` : "";
  let html = "";
  if (plan.gate) {
    html += `<div class="mt-3 pt-3" style="border-top:1px solid #E7EEF7;">
      <div class="eyebrow mb-1" style="font-size:9.5px;">📍 Your Gate</div>
      <div class="flex items-center justify-between py-1">
        <span class="text-[10.5px]">${plan.gate.name} · <span style="color:${LEVEL_HEX[plan.gate.level]}">${LEVEL_LABEL[plan.gate.level] || plan.gate.level}</span></span>
        ${navLink(plan.gate.lat, plan.gate.lng)}
      </div>
    </div>`;
  }
  const journeyRows = [];
  if (plan.hotel) journeyRows.push(`<div class="flex items-center justify-between py-1"><span class="text-[10.5px]">🏨 <b>${plan.hotel.name}</b></span>${navLink(plan.hotel.lat, plan.hotel.lng)}</div>`);
  if (plan.transport) journeyRows.push(`<div class="text-[10.5px] text-muted py-1">🚍 ${plan.transport.recommendation}</div>`);
  if (plan.arrival) journeyRows.push(`<div class="text-[10.5px] text-muted py-1">🕒 ${plan.arrival.recommendation}</div>`);
  if (journeyRows.length) {
    html += `<div class="mt-3 pt-3" style="border-top:1px solid #E7EEF7;"><div class="eyebrow mb-1" style="font-size:9.5px;">🧭 Your Journey</div>${journeyRows.join("")}</div>`;
  }
  return html;
}

async function renderLiveCrowd() {
  const box = document.getElementById("live-crowd-box");
  if (activeTab !== "active" || !anyLiveActive) { box.classList.add("hidden"); return; }
  try {
    const res = await api("/api/ai/attendee-advisory");
    if (res.text) {
      box.classList.remove("hidden");
      box.innerHTML = `<div class="eyebrow mb-1">🔴 Live Crowd</div><p class="text-sm text-accent m-0">✨ ${res.text}</p>`;
    } else {
      box.classList.remove("hidden");
      box.innerHTML = `<div class="eyebrow mb-1">🔴 Live Crowd</div><p class="text-sm text-muted m-0">All gates are moving smoothly right now.</p>`;
    }
  } catch (e) { box.classList.add("hidden"); }
}

function renderNotifs() {
  const box = document.getElementById("notif-box");
  if (activeTab !== "active" || !notifs.length) { box.classList.add("hidden"); return; }
  const unread = notifs.filter(n => !n.is_read).length;
  box.classList.remove("hidden");
  box.innerHTML = `
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <span class="text-sm">🔔 <b>${unread}</b> unread alert${unread === 1 ? "" : "s"} for attendees</span>
      <a href="notifications.html" class="text-accent text-xs font-bold no-underline">View all in Alerts →</a>
    </div>`;
}

// --- Live-event info (accessibility/evacuation, hotels, transport) --------
// Only shown when the attendee's own active booking is for the currently
// live event (plan.is_live from /api/my-plan) — never "whatever event
// happens to be live globally" independent of what this attendee booked.

function getMyLocation() {
  if (cachedLocation || locationRequested) return Promise.resolve(cachedLocation);
  locationRequested = true;
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { cachedLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; resolve(cachedLocation); },
      () => resolve(null),
      { timeout: 4000 },
    );
  });
}

async function onAccessibleToggle() {
  const checked = document.getElementById("accessible-toggle").checked;
  if (checked) {
    const loc = await getMyLocation();
    await api("/api/attendee/accessibility-request", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: getEmail() || null, ...(loc ? { lat: loc.lat, lng: loc.lng } : {}) }),
    });
  }
  await renderEvacuation(liveEventId);
}

async function renderEvacuation(eventId) {
  const el = document.getElementById("evac-status");
  if (!el) return;
  const accessibleOnly = document.getElementById("accessible-toggle").checked;
  const loc = await getMyLocation();
  const locQuery = loc ? `&lat=${loc.lat}&lng=${loc.lng}` : "";
  const eventQuery = eventId != null ? `&event_id=${eventId}` : "";
  const data = await api(`/api/evacuation-routes?accessible_only=${accessibleOnly}${locQuery}${eventQuery}`);
  const top = data.routes[0];
  const exitLine = top
    ? `<b>${top.name}</b>${top.distance_km != null ? ` (${top.distance_km} km)` : ""}${top.is_accessible ? " ♿" : ""}`
    : null;
  if (data.emergency_active) {
    el.innerHTML = `<span class="text-danger font-bold">🚨 Emergency near ${data.emergency_zone || "the venue"}.</span> ` +
      (exitLine ? `Nearest safe exit: ${exitLine}.` : `No safe exit currently computed — follow staff instructions.`);
  } else if (exitLine) {
    el.innerHTML = `Recommended exit: ${exitLine}.`;
  } else {
    el.innerHTML = accessibleOnly
      ? `<span class="text-muted">No accessible exit configured yet — ask a staff member for assistance.</span>`
      : `<span class="text-muted">No gate data yet.</span>`;
  }
}

async function loadUserHotels(eventId) {
  const el = document.getElementById("user-hotels");
  if (!el) return;
  el.innerHTML = '<div class="text-xs text-muted">Loading live room availability…</div>';
  try {
    const data = await api(`/api/attendee/hotels${eventId != null ? `?event_id=${eventId}` : ""}`);
    el.innerHTML = data.hotels.length ? data.hotels.slice(0, 4).map(h => {
      const live = h.last_updated ? "LIVE" : "DEMO";
      return `<div class="p-3 rounded-xl" style="border:1px solid #E7EEF7;">
        <div class="flex items-center justify-between gap-2">
          <span class="font-bold text-sm">🏨 ${h.name}</span>
          <span class="text-[10px] text-muted">${live}</span>
        </div>
        <div class="text-[10.5px] text-muted mt-1">${h.available_rooms} rooms free${h.distance_km != null ? ` · ${h.distance_km} km from venue` : ""}</div>
      </div>`;
    }).join("") : '<div class="text-xs text-muted">No connected hotel inventory yet.</div>';
  } catch (e) { el.innerHTML = '<div class="text-xs text-muted">Live hotel data is temporarily unavailable.</div>'; }
}

async function loadUserTransport(eventId) {
  const el = document.getElementById("user-transport");
  if (!el) return;
  el.innerHTML = '<div class="text-xs text-muted">Loading transport options…</div>';
  try {
    const data = await api(`/api/attendee/transport${eventId != null ? `?event_id=${eventId}` : ""}`);
    const local = data.local || {};
    const buses = (local.buses && local.buses.city) || [];
    const trains = (local.trains && local.trains.suburban) || [];
    const flights = (data.flights && data.flights.arrivals) || [];
    let html = "";
    if (buses.length) html += `<div class="mb-2"><div class="eyebrow mb-1" style="font-size:9.5px;">🚌 Buses (citywide)</div>${buses.slice(0, 3).map(x => `<div class="flex justify-between py-1 text-xs"><span>${x.route}</span><span class="font-mono">${x.arrives_in_min} min</span></div>`).join("")}</div>`;
    if (trains.length) html += `<div class="mb-2"><div class="eyebrow mb-1" style="font-size:9.5px;">🚆 Trains (citywide)</div>${trains.slice(0, 3).map(x => `<div class="flex justify-between py-1 text-xs"><span>${x.line}</span><span class="font-mono">${x.arrives_in_min} min</span></div>`).join("")}</div>`;
    if (flights.length) html += `<div><div class="eyebrow mb-1" style="font-size:9.5px;">✈️ Arrivals (citywide)</div>${flights.slice(0, 3).map(x => `<div class="flex justify-between py-1 text-xs"><span>${x.airline}</span><span class="font-mono">${x.arrives_in_min} min</span></div>`).join("")}</div>`;
    html += `<div class="text-[10px] text-muted mt-2">Buses/trains/flights above are city/region-level schedules (illustrative, not live operator tracking) — not specific to this event. Only bus-dispatch predictions below are computed for this event's own transport zones.</div>`;
    el.innerHTML = html || '<div class="text-xs text-muted">No transport feed available for this event.</div>';
  } catch (e) { el.innerHTML = '<div class="text-xs text-muted">Transport data is temporarily unavailable.</div>'; }
}

function renderLiveInfo() {
  const box = document.getElementById("live-info");
  if (activeTab !== "active" || !anyLiveActive) { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  const toggle = document.getElementById("accessible-toggle");
  if (!toggle.dataset.defaulted) {
    toggle.dataset.defaulted = "1";
    try { toggle.checked = localStorage.getItem("vyavastha_pref_accessible") === "1"; } catch (e) {}
  }
  renderEvacuation(liveEventId);
  loadUserHotels(liveEventId);
  loadUserTransport(liveEventId);
}

function render() {
  const list = bookingsData[activeTab] || [];
  document.getElementById("bookings-list").innerHTML = list.length
    ? list.map(bookingCard).join("")
    : `<div class="text-center text-muted text-xs py-16 col-span-full">No ${activeTab} events yet.</div>`;
  renderLiveCrowd();
  renderLiveInfo();
  renderNotifs();
}

function showQr(code) {
  document.getElementById("qr-veil").classList.add("show");
  document.getElementById("qr-code-text").textContent = code;
  document.getElementById("qr-code").innerHTML = "";
  try { new QRCode(document.getElementById("qr-code"), { text: code, width: 160, height: 160, colorDark: "#123B6D", colorLight: "#ffffff" }); } catch (e) {}
}
function closeQr() { document.getElementById("qr-veil").classList.remove("show"); }

async function load() {
  const email = getEmail();
  if (!email) {
    document.getElementById("noemail").classList.remove("hidden");
    document.getElementById("body-view").classList.add("hidden");
    return;
  }
  document.getElementById("noemail").classList.add("hidden");
  document.getElementById("body-view").classList.remove("hidden");
  bookingsData = await api(`/api/my-bookings?email=${encodeURIComponent(email)}`);

  if (bookingsData.active && bookingsData.active.length) {
    const entries = await Promise.all(bookingsData.active.map(async b => {
      try { return [b.code, await api(`/api/my-plan?code=${b.code}`)]; } catch (e) { return null; }
    }));
    plansByCode = Object.fromEntries(entries.filter(Boolean));
    const livePlan = Object.values(plansByCode).find(p => p && p.is_live);
    anyLiveActive = !!livePlan;
    liveEventId = livePlan ? livePlan.event_id : null;
    try {
      // Scoped to the attendee's own live event (falls back to including
      // event-agnostic system notices) — never another event's feed mixed in.
      const notifQuery = liveEventId != null ? `&event_id=${liveEventId}` : "";
      notifs = await api(`/api/notifications?role=Attendee${notifQuery}`);
    } catch (e) { notifs = []; }
  } else {
    plansByCode = {};
    notifs = [];
    anyLiveActive = false;
    liveEventId = null;
  }
  render();
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
