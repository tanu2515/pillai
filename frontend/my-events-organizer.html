<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYAVASTHA — My Events</title>
<link rel="icon" type="image/png" href="/assets/vyavastha-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: "#EAF7F4", surface: "#FFFFFF", panel: "#FFFFFF", border: "#E2E8F0",
          muted: "#64748B", ink: "#123B6D", accent: "#1976D2", accentDim: "#123B6D",
          green: "#20C997", greenLight: "#5BE7A9", warn: "#F59E0B", ok: "#22C55E",
          high: "#F87171", danger: "#DC2626",
        },
        fontFamily: { sans: ["Manrope", "system-ui", "sans-serif"], mono: ["JetBrains Mono", "ui-monospace", "monospace"] },
      },
    },
  };
</script>
<style>
  body{
    background-image:
      radial-gradient(circle at 85% 0%, rgba(25,118,210,.05), transparent 45%),
      radial-gradient(circle at 10% 100%, rgba(32,201,151,.05), transparent 45%),
      linear-gradient(#E2E8F0 1px, transparent 1px), linear-gradient(90deg, #E2E8F0 1px, transparent 1px);
    background-size:auto, auto, 36px 36px, 36px 36px; background-color:#EAF7F4;
  }
  .row-card{ background:#FFFFFF; border:1px solid #E2E8F0; border-radius:14px; box-shadow:0 1px 2px rgba(18,59,109,.04); transition:.15s; }
  .row-card.event-card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(18,59,109,.08); border-color:#1976D2; }
  .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.16em; color:#64748B; text-transform:uppercase; }
  .btn-primary{ background:#1976D2; color:#fff; font-weight:800; letter-spacing:.04em; transition:.15s; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-secondary{ background:#F1F5F9; color:#123B6D; font-weight:700; transition:.15s; }
  .btn-secondary:hover{ background:#E2E8F0; }
  .status-pill{ font-size:9.5px; font-weight:800; letter-spacing:.06em; border-radius:20px; padding:3px 10px; text-transform:uppercase; }
  .kv{ font-size:11px; color:#64748B; display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .kv b{ color:#123B6D; font-weight:700; }
  .section-head{ display:flex; align-items:center; gap:8px; margin:22px 0 10px; }
  .section-head .line{ flex:1; height:1px; background:#E2E8F0; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .fade-up{ animation: fadeUp .35s cubic-bezier(.2,.8,.2,1) both; }
</style>
<script src="/assets/account-avatar.js"></script>
</head>
<body class="bg-bg text-ink font-sans m-0 min-h-screen pb-16">

<div class="sticky top-0 z-10 bg-surface/95 backdrop-blur border-b border-border">
  <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-3 flex-wrap">
    <div class="flex items-center gap-3">
      <a href="/"><img src="/assets/vyavastha-icon.png" alt="VYAVASTHA" class="w-8 h-8 rounded-lg" /></a>
      <h1 class="text-sm font-extrabold m-0 tracking-[0.1em] uppercase flex items-center gap-2">
        <span>MY EVENTS</span>
        <span class="text-[9.5px] font-mono tracking-[.08em] normal-case bg-accent/10 border border-accent/30 text-accent rounded-full px-2 py-0.5">EVENT COMMAND OPERATOR</span>
      </h1>
    </div>
    <div class="flex items-center gap-3">
      <a href="event-setup.html" class="text-xs text-accent hover:underline font-bold">Live Event Setup →</a>
      <a href="/login.html" class="text-xs text-muted hover:text-accent hover:underline font-medium">Switch role →</a>
      <div id="account-avatar" class="hidden w-7 h-7 rounded-full bg-accent text-white text-[11px] font-extrabold flex items-center justify-center ml-1"></div>
    </div>
  </div>
</div>

<main class="p-4 sm:p-6 max-w-6xl mx-auto">

  <div id="noemail" class="row-card p-6 max-w-md mx-auto mt-8 hidden fade-up text-center">
    <p class="text-sm mb-3">Sign in as an Event Organiser to see your events.</p>
    <a href="/login.html?role=Event%20Command%20Operator" class="btn-primary inline-block px-5 py-2.5 rounded-lg text-xs no-underline">GO TO SIGN IN</a>
  </div>

  <div id="body-view" class="hidden">
    <div class="row-card p-4 mb-2 flex items-center justify-between gap-3 flex-wrap fade-up">
      <div>
        <p class="text-muted text-xs m-0">Signed in as <b id="who-email" class="text-ink font-mono"></b> — showing only events you created.</p>
      </div>
    </div>

    <div id="empty-state" class="row-card p-10 text-center mt-6 hidden fade-up">
      <div class="text-3xl mb-2">🗓</div>
      <p class="text-sm text-muted mb-3">You haven't created any events yet.</p>
      <a href="create-event.html" class="btn-primary inline-block px-5 py-2.5 rounded-lg text-xs no-underline">+ CREATE YOUR FIRST EVENT</a>
    </div>

    <div id="sections"></div>
  </div>
</main>

<script>
const API = "";
async function api(path) { const res = await fetch(API + path); return res.json(); }
function getOperatorEmail() { try { return sessionStorage.getItem("vyavastha_email") || ""; } catch (e) { return ""; } }
function esc(s) { return (s ?? "").toString().replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

const STATUS_STYLE = {
  live: { bg: "rgba(34,197,94,.1)", border: "rgba(34,197,94,.35)", color: "#16A34A", label: "● LIVE" },
  upcoming: { bg: "rgba(25,118,210,.08)", border: "rgba(25,118,210,.3)", color: "#1976D2", label: "UPCOMING" },
  paused: { bg: "#F1F5F9", border: "#E2E8F0", color: "#64748B", label: "PAUSED" },
  completed: { bg: "#F1F5F9", border: "#E2E8F0", color: "#64748B", label: "COMPLETED" },
};

const SECTIONS = [
  { key: "live", title: "🔴 Live", empty: "No live event right now." },
  { key: "upcoming", title: "🗓 Upcoming", empty: "No upcoming events." },
  { key: "completed", title: "✅ Completed", empty: "No completed events yet." },
];

function eventCard(e) {
  const st = STATUS_STYLE[e.status] || STATUS_STYLE.upcoming;
  const isLive = e.status === "live";
  const manageHref = isLive ? "event-setup.html" : `event-detail.html?id=${e.id}`;
  const manageLabel = isLive ? "Manage in Event Setup →" : "View Event →";
  return `
    <a href="${manageHref}" target="${isLive ? "_self" : "_blank"}" class="row-card event-card p-4 no-underline text-ink fade-up">
      <div class="flex items-start justify-between gap-2 mb-1">
        <div class="font-bold text-sm">${e.banner_emoji || "🎉"} ${esc(e.name)}</div>
        <span class="status-pill" style="background:${st.bg};border:1px solid ${st.border};color:${st.color};">${st.label}</span>
      </div>
      <div class="text-muted text-[11px] mb-2">${esc(e.category || "Event")}</div>
      <div class="kv"><span>Date</span><b>${e.event_date || "TBA"}${e.event_time ? " · " + e.event_time : ""}</b></div>
      <div class="kv"><span>Venue</span><b>${esc(e.venue_name || "—")}</b></div>
      <div class="kv"><span>City</span><b>${esc(e.city || "—")}</b></div>
      <div class="kv"><span>Expected attendance</span><b>${(e.expected_attendance ?? 0).toLocaleString?.() ?? e.expected_attendance}</b></div>
      <div class="kv"><span>Capacity</span><b>${(e.safe_capacity ?? 0).toLocaleString?.() ?? e.safe_capacity}</b></div>
      <div class="kv"><span>Owner</span><b class="font-mono" style="font-size:10px;">${esc(e.owner_email || "—")}</b></div>
      <div class="text-accent text-[11px] font-bold mt-2">${manageLabel}</div>
    </a>`;
}

async function load() {
  const email = getOperatorEmail();
  if (!email) {
    document.getElementById("noemail").classList.remove("hidden");
    document.getElementById("body-view").classList.add("hidden");
    return;
  }
  document.getElementById("noemail").classList.add("hidden");
  document.getElementById("body-view").classList.remove("hidden");
  document.getElementById("who-email").textContent = email;

  const events = await api(`/api/events/mine?email=${encodeURIComponent(email)}`);
  document.getElementById("empty-state").classList.toggle("hidden", events.length > 0);

  const byStatus = { live: [], upcoming: [], paused: [], completed: [] };
  events.forEach(e => (byStatus[e.status] || byStatus.upcoming).push(e));

  document.getElementById("sections").innerHTML = SECTIONS.map(s => {
    const list = byStatus[s.key] || [];
    return `
      <div class="section-head"><span class="eyebrow">${s.title} (${list.length})</span><div class="line"></div></div>
      ${list.length
        ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${list.map(eventCard).join("")}</div>`
        : `<p class="text-muted text-xs">${s.empty}</p>`}
    `;
  }).join("");
}

load();
</script>
</body>
</html>
