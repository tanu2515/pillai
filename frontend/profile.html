<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYAVASTHA — Profile</title>
<link rel="icon" type="image/png" href="/assets/vyavastha-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      bg: "#F5FAFF", panel: "#FFFFFF", surface: "#FFFFFF", border: "#E7EEF7",
      muted: "#64748B", ink: "#123B6D", accent: "#1976D2", accentDim: "#123B6D",
      green: "#20C997", greenLight: "#5BE7A9", warn: "#F59E0B", ok: "#22C55E", high: "#F87171", danger: "#DC2626",
      pastelBlue: "#E4F1FF", pastelGreen: "#DFFBF1",
    }, fontFamily: { sans: ["Manrope","system-ui","sans-serif"], mono: ["JetBrains Mono","ui-monospace","monospace"] } } },
  };
</script>
<style>
  body{ background: radial-gradient(circle at 10% 5%, rgba(25,118,210,.06), transparent 45%), radial-gradient(circle at 90% 90%, rgba(32,201,151,.07), transparent 45%), #F5FAFF; }
  .brand-mark{ background:linear-gradient(90deg,#123B6D,#20C997); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card{ background:#FFFFFF; border:1px solid #E7EEF7; border-radius:16px; box-shadow:0 2px 8px rgba(18,59,109,.04); }
  .top-nav{ position:sticky; top:0; z-index:40; background:rgba(245,250,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid #E7EEF7; }
  .nav-link{ font-size:13px; font-weight:700; color:#64748B; text-decoration:none; padding:8px 14px; border-radius:10px; transition:.15s; }
  .nav-link:hover{ background:#E4F1FF; color:#1976D2; }
  .nav-link.active{ background:#1976D2; color:#fff; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .fade-up{ animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  .menu-item{ display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid #E7EEF7; text-decoration:none; color:#123B6D; transition:.15s; }
  .menu-item:hover{ background:#F5FAFF; padding-left:22px; }
  .menu-item:last-child{ border-bottom:none; }
  .avatar{ width:76px; height:76px; border-radius:50%; background:linear-gradient(135deg,#1976D2,#20C997); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:28px; }
  input[type=text], input[type=tel]{ background:#FFFFFF; border:1px solid #E7EEF7; color:#123B6D; border-radius:10px; transition:.15s; }
  input:focus{ outline:none; border-color:#1976D2; box-shadow:0 0 0 4px rgba(25,118,210,.1); }
  .btn-save{ background:#1976D2; color:#fff; font-weight:800; transition:.2s; }
  .btn-save:hover{ background:#123B6D; transform:translateY(-1px); }
  .btn-logout{ transition:.2s; }
  .btn-logout:hover{ background:#FEF2F2; transform:translateY(-1px); }
</style>
</head>
<body class="bg-bg text-ink font-sans m-0 min-h-screen pb-16">

<nav class="top-nav">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-3 flex items-center justify-between">
    <a href="events.html" class="flex items-center gap-2.5 no-underline">
      <img src="/assets/vyavastha-icon.png" alt="VYAVASTHA" class="w-9 h-9 rounded-lg" />
      <span class="brand-mark text-lg font-extrabold tracking-[0.02em]">VYAVASTHA</span>
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="events.html" class="nav-link">Home</a>
      <a href="events.html?explore=1" class="nav-link">Explore</a>
      <a href="my-events.html" class="nav-link">My Events</a>
      <a href="notifications.html" class="nav-link">Alerts</a>
      <a href="attendee.html" class="nav-link">Live Status</a>
    </div>
    <a href="profile.html" class="w-9 h-9 rounded-full flex items-center justify-center text-lg" style="background:#1976D2;color:#fff;">👤</a>
  </div>
</nav>

<div class="max-w-3xl mx-auto px-6 lg:px-10 py-8">
  <h1 class="text-2xl font-extrabold m-0 fade-up">Profile</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
    <section class="card p-6 flex items-center gap-5 fade-up" style="animation-delay:.05s">
      <div class="avatar" id="avatar-initial">?</div>
      <div class="flex-1">
        <input type="text" id="p-name" placeholder="Your name" class="w-full p-2.5 text-sm mb-1.5" />
        <div id="p-email" class="text-muted text-xs font-mono"></div>
      </div>
    </section>

    <section class="card p-6 fade-up" style="animation-delay:.1s">
      <label class="block text-[10px] font-bold uppercase tracking-wide text-muted mb-1">Phone number</label>
      <input type="tel" id="p-phone" placeholder="+91 XXXXX XXXXX" class="w-full p-2.5 text-sm" />
      <button class="btn-save mt-3 w-full py-2.5 rounded-lg text-xs" onclick="saveProfile()">SAVE</button>
      <div id="save-status" class="text-ok text-xs mt-2"></div>
    </section>
  </div>

  <section class="card overflow-hidden mt-6 fade-up" style="animation-delay:.15s">
    <a href="my-events.html" class="menu-item"><span>🎟️ My Events &amp; Registrations</span><span class="text-muted">›</span></a>
    <a href="notifications.html" class="menu-item"><span>🔔 Notifications</span><span class="text-muted">›</span></a>
    <a href="#" class="menu-item" onclick="alert('Preferences coming soon.'); return false;"><span>⚙️ Preferences</span><span class="text-muted">›</span></a>
    <a href="#" class="menu-item" onclick="alert('Contact your event organizer or use the AI chatbot on the event page for help.'); return false;"><span>❓ Help</span><span class="text-muted">›</span></a>
  </section>

  <section class="mt-6 fade-up" style="animation-delay:.2s">
    <button class="btn-logout w-full py-3 rounded-lg text-sm font-bold card text-danger" onclick="logout()">LOG OUT</button>
  </section>
</div>

<script>
function getEmail() { try { return sessionStorage.getItem("vyavastha_email") || ""; } catch (e) { return ""; } }

function load() {
  const email = getEmail();
  document.getElementById("p-email").textContent = email || "Not signed in";
  document.getElementById("avatar-initial").textContent = (email || "?").charAt(0).toUpperCase();
  try {
    document.getElementById("p-name").value = localStorage.getItem("vyavastha_profile_name") || "";
    document.getElementById("p-phone").value = localStorage.getItem("vyavastha_profile_phone") || "";
  } catch (e) {}
}

function saveProfile() {
  try {
    localStorage.setItem("vyavastha_profile_name", document.getElementById("p-name").value.trim());
    localStorage.setItem("vyavastha_profile_phone", document.getElementById("p-phone").value.trim());
  } catch (e) {}
  const status = document.getElementById("save-status");
  status.textContent = "Saved.";
  setTimeout(() => status.textContent = "", 1500);
}

function logout() {
  try { sessionStorage.removeItem("vyavastha_email"); sessionStorage.removeItem("vyavastha_role"); } catch (e) {}
  location.href = "login.html?role=Attendee";
}

load();
</script>
</body>
</html>
