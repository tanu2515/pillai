<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYAVASTHA — Event Details</title>
<link rel="icon" type="image/png" href="/assets/vyavastha-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      bg: "#F5FAFF", panel: "#FFFFFF", surface: "#FFFFFF", border: "#E7EEF7",
      muted: "#64748B", ink: "#123B6D", accent: "#1976D2", accentDim: "#123B6D",
      green: "#20C997", greenLight: "#5BE7A9", warn: "#F59E0B", ok: "#22C55E", high: "#F87171", danger: "#DC2626",
      pastelBlue: "#E4F1FF", pastelGreen: "#DFFBF1",
    }, fontFamily: { sans: ["Manrope","system-ui","sans-serif"], mono: ["JetBrains Mono","ui-monospace","monospace"] } } },
  };
</script>
<style>
  body{
    background:
      radial-gradient(circle at 10% 5%, rgba(25,118,210,.06), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(32,201,151,.07), transparent 45%),
      #F5FAFF;
  }
  .brand-mark{ background:linear-gradient(90deg,#123B6D,#20C997); -webkit-background-clip:text; background-clip:text; color:transparent; }
  input[type=text]{ background:#FFFFFF; border:1px solid #E7EEF7; color:#123B6D; border-radius:12px; transition:.15s; }
  input[type=text]:focus{ outline:none; border-color:#1976D2; box-shadow:0 0 0 4px rgba(25,118,210,.1); }
  .btn-primary{ background:#1976D2; color:#fff; font-weight:800; letter-spacing:.02em; transition:.2s; }
  .btn-primary:hover{ background:#123B6D; transform:translateY(-1px); box-shadow:0 8px 20px rgba(25,118,210,.3); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-secondary{ background:#E4F1FF; border:1px solid transparent; color:#123B6D; font-weight:700; transition:.15s; }
  .btn-secondary:hover{ background:#D2E9FF; }
  .eyebrow{ font-size:11px; font-weight:800; letter-spacing:.14em; color:#123B6D; }
  .card{ background:#FFFFFF; border:1px solid #E7EEF7; border-radius:16px; box-shadow:0 2px 8px rgba(18,59,109,.04); }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
  .fade-up{ animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both; }

  .top-nav{ position:sticky; top:0; z-index:40; background:rgba(245,250,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid #E7EEF7; }
  .nav-link{ font-size:13px; font-weight:700; color:#64748B; text-decoration:none; padding:8px 14px; border-radius:10px; transition:.15s; }
  .nav-link:hover{ background:#E4F1FF; color:#1976D2; }

  .live-pill{ font-size:9.5px; font-weight:800; letter-spacing:.06em; color:#fff; background:#22C55E; border-radius:20px; padding:3px 9px; }
  .banner{ height:220px; display:flex; align-items:center; justify-content:center; font-size:72px; background:linear-gradient(135deg, #E4F1FF, #DFFBF1); border-radius:20px; transition:.3s; }
  .tier-card{ background:#FFFFFF; border:1.5px solid #E7EEF7; border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; transition:.15s; }
  .tier-card:hover{ border-color:#1976D2; transform:translateY(-2px); box-shadow:0 6px 16px rgba(18,59,109,.08); }
  .tier-card.selected{ border-color:#1976D2; background:#E4F1FF; box-shadow:0 0 0 3px rgba(25,118,210,.12); }
  .tier-card.sold-out{ opacity:.5; cursor:not-allowed; }
  .tier-card.sold-out:hover{ transform:none; box-shadow:none; }
  .seat-grid{ display:grid; grid-template-columns:repeat(12, 1fr); gap:7px; margin-top:12px; }
  .seat{ aspect-ratio:1; border-radius:7px; border:1px solid #E7EEF7; background:#F5FAFF; color:#123B6D; font-size:9.5px; font-family:'JetBrains Mono',monospace; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.12s; }
  .seat:hover{ border-color:#1976D2; transform:scale(1.08); }
  .seat.booked{ background:#F87171; color:#fff; border-color:#F87171; cursor:not-allowed; opacity:.55; }
  .seat.booked:hover{ transform:none; }
  .seat.selected{ background:#1976D2; color:#fff; border-color:#1976D2; }
  .stepper-btn{ width:32px; height:32px; border-radius:9px; background:#F5FAFF; border:1px solid #E7EEF7; color:#123B6D; font-weight:800; font-size:16px; transition:.15s; }
  .stepper-btn:hover{ background:#E4F1FF; border-color:#1976D2; }
  .tab-group{ display:flex; gap:6px; background:#F5FAFF; border-radius:10px; padding:4px; }
  .tab-opt{ flex:1; text-align:center; padding:8px 10px; border-radius:8px; font-size:12px; font-weight:700; color:#64748B; cursor:pointer; transition:.15s; }
  .tab-opt:hover{ color:#1976D2; }
  .tab-opt.active{ background:#1976D2; color:#fff; box-shadow:0 2px 6px rgba(25,118,210,.3); }
  .level-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .modal-veil{ position:fixed; inset:0; background:rgba(18,59,109,.45); backdrop-filter:blur(2px); z-index:60; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-veil.show{ display:flex; animation: veilIn .2s ease both; }
  @keyframes veilIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal-sheet{ width:100%; max-width:26rem; max-height:90vh; overflow-y:auto; background:#FFFFFF; border-radius:22px; padding:24px; animation: sheetIn .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sheetIn{ from{ opacity:0; transform:translateY(20px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  #map{ height:220px; border-radius:14px; }
  .sticky-panel{ position:sticky; top:88px; }
</style>
</head>
<body class="bg-bg text-ink font-sans m-0 min-h-screen pb-10">

<nav class="top-nav">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-3 flex items-center justify-between">
    <a href="events.html" class="flex items-center gap-2.5 no-underline">
      <img src="/assets/vyavastha-icon.png" alt="VYAVASTHA" class="w-9 h-9 rounded-lg" />
      <span class="brand-mark text-lg font-extrabold tracking-[0.02em]">VYAVASTHA</span>
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="events.html" class="nav-link">Home</a>
      <a href="events.html?explore=1" class="nav-link">Explore</a>
      <a href="my-events.html" class="nav-link">My Events</a>
      <a href="notifications.html" class="nav-link">Alerts</a>
      <a href="attendee.html" class="nav-link">Live Status</a>
    </div>
    <a href="events.html" class="text-accent text-sm font-bold">← Back</a>
  </div>
</nav>

<div id="loading" class="text-center text-muted text-sm mt-16">Loading event…</div>

<div id="content" class="hidden max-w-7xl mx-auto px-6 lg:px-10 py-8">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2">
      <div class="banner fade-up" id="ev-banner"></div>

      <section class="card p-6 mt-6 fade-up" style="animation-delay:.05s">
        <div class="flex items-center gap-2 flex-wrap">
          <h2 id="ev-name" class="text-2xl font-extrabold m-0"></h2>
          <span id="ev-live-pill" class="live-pill hidden">LIVE</span>
        </div>
        <p id="ev-datetime" class="text-muted text-sm font-mono mt-1.5"></p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
          <div>
            <p id="ev-venue" class="text-sm font-bold m-0"></p>
            <p id="ev-address" class="text-muted text-xs mt-0.5"></p>
          </div>
          <div id="map" class="hidden"></div>
        </div>
        <div class="flex gap-6 mt-4 text-xs font-mono text-muted">
          <span>Expected: <b id="ev-expected" class="text-ink"></b></span>
          <span>Capacity: <b id="ev-capacity" class="text-ink"></b></span>
        </div>
      </section>

      <section class="card p-6 mt-6 fade-up" style="animation-delay:.1s">
        <h3 class="eyebrow mb-2">About this event</h3>
        <p id="ev-desc" class="text-sm leading-relaxed m-0"></p>
      </section>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6">
        <section class="card p-6 fade-up" style="animation-delay:.15s">
          <h3 class="eyebrow mb-2">Schedule</h3>
          <div id="ev-schedule" class="text-sm"></div>
        </section>
        <section class="card p-6 fade-up" style="animation-delay:.15s">
          <h3 class="eyebrow mb-2">Gates &amp; crowd status</h3>
          <div id="ev-gates"></div>
        </section>
        <section class="card p-6 fade-up" style="animation-delay:.2s">
          <h3 class="eyebrow mb-2">Transport</h3>
          <div id="ev-transport" class="text-sm"></div>
        </section>
        <section class="card p-6 fade-up" style="animation-delay:.2s">
          <h3 class="eyebrow mb-2">Nearby hotels</h3>
          <div id="ev-hotels" class="text-sm"></div>
        </section>
      </div>

      <section id="ev-announcements-section" class="card p-6 mt-6 hidden fade-up" style="animation-delay:.25s">
        <h3 class="eyebrow mb-2">Announcements</h3>
        <div id="ev-announcements" class="text-sm"></div>
      </section>
    </div>

    <div class="lg:col-span-1">
      <div class="sticky-panel fade-up" style="animation-delay:.1s">
        <section class="card p-6">
          <h3 class="eyebrow mb-3">Select a ticket</h3>
          <div id="tiers-list"></div>
          <button class="btn-primary w-full py-3.5 rounded-xl text-sm mt-2" id="register-btn" onclick="openBookingSheet()" disabled>SELECT A TICKET</button>
        </section>
      </div>
    </div>
  </div>
</div>

<!-- Booking sheet -->
<div class="modal-veil" id="booking-veil" onclick="if(event.target===this) closeBookingSheet()">
  <div class="modal-sheet" id="booking-sheet"></div>
</div>

<script>
const API = "";
async function api(path, opts) { const res = await fetch(API + path, opts); return res.json(); }
const params = new URLSearchParams(location.search);
const eventId = params.get("id");
let eventData = null;
let selectedTier = null;
let selectedSeatId = null;

function getEmail() { try { return sessionStorage.getItem("vyavastha_email") || ""; } catch (e) { return ""; } }

function fmtDate(dateStr, timeStr) {
  if (!dateStr) return "Date to be announced";
  const d = new Date(dateStr);
  const s = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return timeStr ? `${s} · ${timeStr}` : s;
}

const LEVEL_HEX = { LOW: "#22C55E", MODERATE: "#F59E0B", HIGH: "#F87171", CRITICAL: "#DC2626" };

function renderGates() {
  const el = document.getElementById("ev-gates");
  if (!eventData.is_live) {
    const gateNames = [...new Set(eventData.tiers.map(t => t.gate_name).filter(Boolean))];
    el.innerHTML = gateNames.length
      ? `<p class="text-muted text-xs">Gate assignment (finalized once the event goes live): ${gateNames.join(", ")}.</p>`
      : `<p class="text-muted text-xs">Gate assignments will be shown once the event goes live.</p>`;
    return;
  }
  if (!eventData.gates.length) { el.innerHTML = `<p class="text-muted text-xs">No gate data available.</p>`; return; }
  el.innerHTML = eventData.gates.map(g => `
    <div class="flex items-center justify-between py-1.5">
      <span class="flex items-center gap-2 text-sm"><span class="level-dot" style="background:${LEVEL_HEX[g.level]}"></span>${g.name}</span>
      <span class="text-xs font-mono text-muted">${g.occupancy_pct}% · ${g.level}</span>
    </div>`).join("");
}

function renderTransport() {
  const el = document.getElementById("ev-transport");
  if (!eventData.is_live || !eventData.transport_info) {
    el.innerHTML = `<p class="text-muted text-xs">Transport info and shuttle updates will appear once the event goes live.</p>`;
    return;
  }
  el.innerHTML = eventData.transport_info.map(t => `
    <div class="flex items-center justify-between py-1.5">
      <span>${t.zone_name}</span>
      <span class="text-xs font-mono ${t.extra_buses_needed > 0 ? "text-warn" : "text-muted"}">${t.current_pct}% loaded</span>
    </div>`).join("") || `<p class="text-muted text-xs">No transport zones configured.</p>`;
}

function renderHotels() {
  const el = document.getElementById("ev-hotels");
  if (!eventData.is_live || !eventData.hotels.length) {
    el.innerHTML = `<p class="text-muted text-xs">Hotel recommendations will appear once the event goes live.</p>`;
    return;
  }
  el.innerHTML = eventData.hotels.map(h => `
    <div class="flex items-center justify-between py-1.5">
      <span>${h.name} ${h.recommended ? '<span class="text-ok text-[9px] font-bold uppercase ml-1">Recommended</span>' : ""}</span>
      <span class="text-xs font-mono text-muted">${h.available_pct}% avail.${h.distance_km != null ? " · " + h.distance_km + " km" : ""}</span>
    </div>`).join("");
}

function renderAnnouncements() {
  const section = document.getElementById("ev-announcements-section");
  if (!eventData.announcements.length) { section.classList.add("hidden"); return; }
  section.classList.remove("hidden");
  const colors = { CRITICAL: "danger", HIGH: "warn" };
  document.getElementById("ev-announcements").innerHTML = eventData.announcements.map(a => `
    <div class="flex items-start gap-2 py-1.5">
      <span class="text-${colors[a.severity] || "muted"}">●</span>
      <span class="text-xs">${a.message}</span>
    </div>`).join("");
}

function renderSchedule() {
  const el = document.getElementById("ev-schedule");
  if (!eventData.event_time) { el.innerHTML = `<p class="text-muted text-xs">Schedule to be announced.</p>`; return; }
  const [h, m] = eventData.event_time.split(":").map(Number);
  const fmt = (hh, mm) => {
    const period = hh >= 12 ? "PM" : "AM";
    const hr12 = ((hh + 11) % 12) + 1;
    return `${hr12}:${String(mm).padStart(2, "0")} ${period}`;
  };
  el.innerHTML = `
    <div class="flex justify-between py-1"><span>Gates open</span><span class="font-mono text-muted">${fmt((h + 23) % 24, m)}</span></div>
    <div class="flex justify-between py-1"><span>Event begins</span><span class="font-mono text-muted">${fmt(h, m)}</span></div>
    <div class="flex justify-between py-1"><span>Event concludes (est.)</span><span class="font-mono text-muted">${fmt((h + 3) % 24, m)}</span></div>`;
}

async function renderMap() {
  const mapEl = document.getElementById("map");
  if (!eventData.is_live) return;
  const state = await api("/api/state");
  const withCoords = state.zones.filter(z => z.lat != null && z.lng != null);
  if (!withCoords.length) return;
  mapEl.classList.remove("hidden");
  const map = L.map("map", { zoomControl: false, dragging: true, scrollWheelZoom: false }).setView([withCoords[0].lat, withCoords[0].lng], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "" }).addTo(map);
  withCoords.forEach(z => {
    L.circleMarker([z.lat, z.lng], { radius: 7, color: "#123B6D", weight: 1.5, fillColor: LEVEL_HEX[z.level] || "#1976D2", fillOpacity: 0.9 })
      .addTo(map).bindTooltip(`${z.name} · ${z.level}`);
  });
  setTimeout(() => map.invalidateSize(), 200);
}

function tierCard(t) {
  const soldOut = t.available <= 0;
  const isSelected = selectedTier && selectedTier.id === t.id;
  return `
    <div class="tier-card ${soldOut ? "sold-out" : ""} ${isSelected ? "selected" : ""}" onclick='${soldOut ? "" : `pickTier(${JSON.stringify(t)})`}'>
      <div class="flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">${t.name}</div>
          <div class="text-muted text-[10.5px] font-mono mt-0.5">${t.available.toLocaleString()} / ${t.capacity.toLocaleString()} available</div>
        </div>
        <div class="text-accent font-mono font-bold text-sm">${soldOut ? "SOLD OUT" : "₹" + t.price.toLocaleString()}</div>
      </div>
    </div>`;
}

function pickTier(t) {
  selectedTier = t;
  selectedSeatId = null;
  document.getElementById("tiers-list").innerHTML = eventData.tiers.map(tierCard).join("");
  const btn = document.getElementById("register-btn");
  btn.disabled = false;
  btn.textContent = `REGISTER — ${t.name}`;
}

async function loadEvent() {
  eventData = await api(`/api/events/${eventId}`);
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("content").classList.remove("hidden");

  document.getElementById("ev-banner").textContent = eventData.banner_emoji;
  document.getElementById("ev-name").textContent = eventData.name;
  document.getElementById("ev-live-pill").classList.toggle("hidden", !eventData.is_live);
  document.getElementById("ev-datetime").textContent = fmtDate(eventData.event_date, eventData.event_time);
  document.getElementById("ev-venue").textContent = eventData.venue_name || "Venue to be announced";
  document.getElementById("ev-address").textContent = eventData.venue_address || eventData.city || "";
  document.getElementById("ev-desc").textContent = eventData.description || "No description provided.";
  document.getElementById("ev-expected").textContent = eventData.expected_attendance.toLocaleString();
  document.getElementById("ev-capacity").textContent = eventData.safe_capacity.toLocaleString();
  document.getElementById("tiers-list").innerHTML = eventData.tiers.map(tierCard).join("") ||
    `<div class="text-muted text-sm">No tickets configured for this event yet.</div>`;

  renderSchedule();
  renderGates();
  renderTransport();
  renderHotels();
  renderAnnouncements();
  renderMap();
}

// --- Booking sheet -----------------------------------------------------

let bookingQty = 1;
let wantsHotel = false;
let wantsTransport = false;

function openBookingSheet() {
  if (!selectedTier) return;
  bookingQty = 1; wantsHotel = false; wantsTransport = false; selectedSeatId = null;
  renderBookingSheet();
  document.getElementById("booking-veil").classList.add("show");
}
function closeBookingSheet() { document.getElementById("booking-veil").classList.remove("show"); }

function renderBookingSheet() {
  const t = selectedTier;
  const showHotelToggle = eventData.is_live && eventData.hotels.length > 0;
  const showTransportToggle = eventData.is_live && eventData.transport_info;
  const priorName = document.getElementById("booker-name")?.value || "";
  const sheet = document.getElementById("booking-sheet");
  sheet.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-base font-extrabold m-0">Register for ${eventData.name}</h3>
      <button onclick="closeBookingSheet()" class="text-muted text-lg">✕</button>
    </div>
    <label class="block text-[10.5px] font-bold uppercase tracking-wide text-muted mb-1">Your name</label>
    <input type="text" id="booker-name" placeholder="Full name" class="w-full p-3 text-sm mb-3" value="${priorName.replace(/"/g, "&quot;")}" />
    <div class="card p-3 mb-3" style="background:#F5FAFF;">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">${t.name}</div>
          <div class="text-muted text-[10.5px] font-mono">₹${t.price.toLocaleString()} each</div>
        </div>
        ${t.uses_seats ? `<button class="btn-secondary rounded-lg px-3 py-1.5 text-[11px]" onclick="openSeatPicker()">Pick a seat</button>` : ""}
      </div>
      <div id="seat-chosen" class="text-accent text-xs font-mono mt-2 ${selectedSeatId ? "" : "hidden"}">Seat selected</div>
      <div class="flex items-center justify-between mt-3" id="qty-row">
        <span class="text-xs text-muted">Quantity</span>
        <div class="flex items-center gap-3">
          <button class="stepper-btn" onclick="changeQty(-1)">−</button>
          <span id="qty-val" class="font-mono font-bold w-5 text-center">${selectedSeatId ? 1 : bookingQty}</span>
          <button class="stepper-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>
    </div>
    ${showHotelToggle ? `
    <div class="card p-3 mb-3">
      <div class="font-bold text-sm mb-0.5">Hotel</div>
      <div class="text-muted text-[10.5px] mb-2">${eventData.hotels[0].name} — ${eventData.hotels[0].available_pct}% available</div>
      <div class="tab-group">
        <div class="tab-opt ${!wantsHotel ? "active" : ""}" onclick="setHotel(false)">No hotel</div>
        <div class="tab-opt ${wantsHotel ? "active" : ""}" onclick="setHotel(true)">Add hotel</div>
      </div>
    </div>` : ""}
    ${showTransportToggle ? `
    <div class="card p-3 mb-3">
      <div class="font-bold text-sm mb-0.5">Transport</div>
      <div class="text-muted text-[10.5px] mb-2">We'll try to assign you a bus closer to the event</div>
      <div class="tab-group">
        <div class="tab-opt ${!wantsTransport ? "active" : ""}" onclick="setTransport(false)">No transport</div>
        <div class="tab-opt ${wantsTransport ? "active" : ""}" onclick="setTransport(true)">Request transport</div>
      </div>
    </div>` : ""}
    <div class="flex items-center justify-between text-sm font-bold my-3">
      <span>Total</span><span id="total-price" class="text-accent font-mono">₹${(t.price * (selectedSeatId ? 1 : bookingQty)).toLocaleString()}</span>
    </div>
    <button class="btn-primary w-full py-3.5 rounded-xl text-sm" onclick="confirmBooking()">CONFIRM REGISTRATION</button>
    <div id="booking-error" class="text-warn text-xs mt-2"></div>
  `;
}

function updateTotal() {
  document.getElementById("total-price").textContent = `₹${(selectedTier.price * (selectedSeatId ? 1 : bookingQty)).toLocaleString()}`;
}
function changeQty(delta) {
  if (selectedSeatId) return;
  bookingQty = Math.max(1, Math.min(10, bookingQty + delta));
  document.getElementById("qty-val").textContent = bookingQty;
  updateTotal();
}
function setHotel(v) { wantsHotel = v; renderBookingSheet(); }
function setTransport(v) { wantsTransport = v; renderBookingSheet(); }

async function openSeatPicker() {
  const seats = await api(`/api/events/${eventId}/tiers/${selectedTier.id}/seats`);
  const sheet = document.getElementById("booking-sheet");
  sheet.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-base font-extrabold m-0">Pick a seat — ${selectedTier.name}</h3>
      <button onclick="renderBookingSheet()" class="text-muted text-lg">✕</button>
    </div>
    <div class="seat-grid">
      ${seats.map(s => `<div class="seat ${s.status === 'booked' ? 'booked' : ''}" data-seat-id="${s.id}"
        onclick="${s.status === 'booked' ? '' : `chooseSeat(${s.id})`}">${s.seat_label}</div>`).join("")}
    </div>
    <button class="btn-primary w-full mt-4 py-3 rounded-xl text-sm" onclick="renderBookingSheet()">DONE</button>
  `;
}
function chooseSeat(seatId) { selectedSeatId = seatId; bookingQty = 1; renderBookingSheet(); }

async function confirmBooking() {
  const name = document.getElementById("booker-name").value.trim();
  if (!name) { document.getElementById("booking-error").textContent = "Enter your name to continue."; return; }
  const res = await api(`/api/events/${eventId}/tiers/${selectedTier.id}/book`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email: getEmail() || null, seat_id: selectedSeatId, quantity: selectedSeatId ? 1 : bookingQty, wants_transport: wantsTransport }),
  });
  if (res.status !== "ok") { document.getElementById("booking-error").textContent = res.message || "Something went wrong. Please try again."; return; }
  showConfirmation(res);
  await loadEvent();
}

function showConfirmation(res) {
  const sheet = document.getElementById("booking-sheet");
  sheet.innerHTML = `
    <div class="text-center py-2">
      <div class="text-4xl mb-2">✅</div>
      <h3 class="text-lg font-extrabold m-0">Registration Confirmed</h3>
      <p class="text-muted text-xs mt-1">${eventData.name}</p>
      <div class="card p-4 mt-4 inline-block"><div id="qr-code" class="flex items-center justify-center"></div></div>
      <div class="text-2xl tracking-[5px] text-center font-mono font-bold text-accent my-3">${res.code}</div>
      <p class="text-muted text-xs">${res.tier}${res.seat_label ? " · Seat " + res.seat_label : ""}${res.quantity > 1 ? " · Qty " + res.quantity : ""} · ₹${res.total_price.toLocaleString()}</p>
      <p class="text-muted text-[10.5px] mt-2">Show this code / QR at the gate. Find it anytime under My Events.</p>
      <div class="grid grid-cols-2 gap-2 mt-4">
        <button class="btn-primary py-3 rounded-xl text-sm" onclick="location.href='my-events.html'">MY EVENTS</button>
        <button class="btn-secondary py-3 rounded-xl text-sm" onclick="location.href='attendee.html?event=${eventId}'">EVENT DAY →</button>
      </div>
    </div>`;
  try { new QRCode(document.getElementById("qr-code"), { text: res.code, width: 140, height: 140, colorDark: "#123B6D", colorLight: "#ffffff" }); } catch (e) {}
}

loadEvent();
</script>
</body>
</html>
