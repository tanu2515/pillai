<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYAVASTHA — Notifications</title>
<script src="/assets/theme.js"></script>
<link rel="icon" type="image/png" href="/assets/vyavastha-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      bg: "var(--bg)", panel: "var(--panel)", surface: "var(--surface)", border: "var(--border)",
      muted: "var(--muted)", ink: "var(--ink)", accent: "var(--accent)", accentDim: "var(--accentDim)",
      green: "var(--green)", greenLight: "var(--greenLight)", warn: "var(--warn)", ok: "var(--ok)", high: "var(--high)", danger: "var(--danger)",
      pastelBlue: "var(--pastelBlue)", pastelGreen: "var(--pastelGreen)",
    }, fontFamily: { sans: ["Manrope","system-ui","sans-serif"], mono: ["JetBrains Mono","ui-monospace","monospace"] } } },
  };
</script>
<style>
  :root{
    --bg:#F5FAFF; --surface:#FFFFFF; --panel:#FFFFFF; --panel2:#F9FCFF;
    --border:#E7EEF7; --muted:#64748B; --ink:#123B6D;
    --accent:#1976D2; --accentDim:#123B6D; --green:#20C997; --greenLight:#5BE7A9;
    --warn:#F59E0B; --ok:#22C55E; --high:#F87171; --danger:#DC2626;
    --pastelBlue:#E4F1FF; --pastelGreen:#DFFBF1;
    --accent-rgb:25,118,210; --green-rgb:32,201,151; --danger-rgb:220,38,38;
    --warn-rgb:245,158,11; --high-rgb:248,113,113; --bg-rgb:245,250,255;
  }
  :root[data-theme="dark"]{
    --bg:#071019; --surface:#0d1822; --panel:#0d1822; --panel2:#101f2b;
    --border:#1d3443; --muted:#8fa7b5; --ink:#edf7fa;
    --accent:#2dd4bf; --accentDim:#14b8a6; --green:#34d399; --greenLight:#6ee7b7;
    --warn:#fbbf24; --ok:#34d399; --high:#fb7185; --danger:#e11d48;
    --pastelBlue:#12283a; --pastelGreen:#0f2b22;
    --accent-rgb:45,212,191; --green-rgb:52,211,153; --danger-rgb:225,29,72;
    --warn-rgb:251,191,36; --high-rgb:251,113,133; --bg-rgb:7,16,25;
  }
  body{ background: radial-gradient(circle at 10% 5%, rgba(var(--accent-rgb),.06), transparent 45%), radial-gradient(circle at 90% 90%, rgba(var(--green-rgb),.07), transparent 45%), var(--bg); }
  .brand-mark{ background:linear-gradient(90deg,var(--accentDim),var(--green)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,.04); transition:.2s; }
  .card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.08); }
  .card.unread{ border-left:3px solid var(--accent); background:var(--panel2); }
  .top-nav{ position:sticky; top:0; z-index:40; background:rgba(var(--bg-rgb),.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  .nav-link{ font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; padding:8px 14px; border-radius:10px; transition:.15s; }
  .nav-link:hover{ background:var(--pastelBlue); color:var(--accent); }
  .nav-link.active{ background:var(--accent); color:#fff; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .fade-up{ animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  .sev-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:4px; }
</style>
<script src="/assets/account-avatar.js"></script>
</head>
<body class="bg-bg text-ink font-sans m-0 min-h-screen pb-16">

<nav class="top-nav">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-3 flex items-center justify-between">
    <a href="events.html" class="flex items-center gap-2.5 no-underline">
      <img src="/assets/vyavastha-icon.png" alt="VYAVASTHA" class="w-9 h-9 rounded-lg" />
      <span class="brand-mark text-lg font-extrabold tracking-[0.02em]">VYAVASTHA</span>
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="events.html" class="nav-link">Home</a>
      <a href="events.html?explore=1" class="nav-link">Explore</a>
      <a href="my-events.html" class="nav-link">My Event</a>
      <a href="notifications.html" class="nav-link active">Alerts</a>
    </div>
    <button id="theme-toggle-btn" type="button" onclick="toggleTheme()" class="w-7 h-7 rounded-full flex items-center justify-center text-sm ml-1" style="background:var(--panel2);border:1px solid var(--border);" title="Toggle light/dark theme">🌙</button>
    <a href="profile.html" id="account-avatar" data-avatar-fallback="👤" class="w-9 h-9 rounded-full flex items-center justify-center text-lg font-extrabold" style="background:var(--accent);color:#fff;" title=""></a>
  </div>
</nav>

<header class="max-w-4xl mx-auto px-6 lg:px-10 pt-8 fade-up">
  <h1 class="text-2xl font-extrabold m-0">Alerts</h1>
  <p class="text-muted text-sm mt-1">Shared alerts for attendees at this event — not a private per-user inbox.</p>
</header>

<div id="notif-groups" class="max-w-4xl mx-auto px-6 lg:px-10 mt-6"></div>

<script>
const API = "";
async function api(path, opts) { const res = await fetch(API + path, opts); return res.json(); }

const SEVERITY = {
  CRITICAL: { color: "var(--danger)", icon: "🔴" }, HIGH: { color: "var(--high)", icon: "🟠" },
  MEDIUM: { color: "var(--warn)", icon: "🟡" }, LOW: { color: "var(--ok)", icon: "🟢" },
};

function timeAgo(iso) {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return new Date(iso).toDateString();
}

function notifCard(n, i) {
  const sev = SEVERITY[n.priority] || SEVERITY.MEDIUM;
  return `
    <div class="card p-4 flex gap-3 fade-up ${n.is_read ? "" : "unread"}" style="animation-delay:${Math.min(i * 0.04, 0.3)}s" onclick='markRead(${n.id})'>
      <span class="sev-dot" style="background:${sev.color}"></span>
      <div class="flex-1">
        <div class="font-bold text-sm">${sev.icon} ${n.title}</div>
        ${n.event_name ? `<div class="text-muted text-[10.5px] font-mono mt-0.5">${n.event_name}</div>` : ""}
        <div class="text-sm mt-0.5">${n.message}</div>
        <div class="text-muted text-[10px] font-mono mt-1">${timeAgo(n.created_at)}</div>
      </div>
    </div>`;
}

// Groups by severity tier (Critical/Important/Information) rather than a
// flat list — the underlying priority field is unchanged, only the grouping
// shown to attendees is added on top.
const GROUPS = [
  { key: "CRITICAL", label: "🔴 Critical", priorities: ["CRITICAL"] },
  { key: "HIGH", label: "🟠 Important", priorities: ["HIGH"] },
  { key: "INFO", label: "🟢 Information", priorities: ["MEDIUM", "LOW"] },
];

async function markRead(id) { await api(`/api/notifications/${id}/read`, { method: "POST" }); load(); }

async function load() {
  const list = await api("/api/notifications?role=Attendee");
  const container = document.getElementById("notif-groups");
  if (!list.length) {
    container.innerHTML = `<div class="text-center text-muted text-xs py-16">No alerts yet — you'll see gate, transport, and safety alerts here once an event is live.</div>`;
    return;
  }
  container.innerHTML = GROUPS.map(g => {
    const items = list.filter(n => g.priorities.includes(n.priority));
    if (!items.length) return "";
    return `
      <section class="mb-6">
        <h2 class="eyebrow mb-3">${g.label} (${items.length})</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${items.map(notifCard).join("")}</div>
      </section>`;
  }).join("");
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
