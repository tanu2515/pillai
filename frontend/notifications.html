<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYAVASTHA — Notifications</title>
<link rel="icon" type="image/png" href="/assets/vyavastha-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      bg: "#F5FAFF", panel: "#FFFFFF", surface: "#FFFFFF", border: "#E7EEF7",
      muted: "#64748B", ink: "#123B6D", accent: "#1976D2", accentDim: "#123B6D",
      green: "#20C997", greenLight: "#5BE7A9", warn: "#F59E0B", ok: "#22C55E", high: "#F87171", danger: "#DC2626",
      pastelBlue: "#E4F1FF", pastelGreen: "#DFFBF1",
    }, fontFamily: { sans: ["Manrope","system-ui","sans-serif"], mono: ["JetBrains Mono","ui-monospace","monospace"] } } },
  };
</script>
<style>
  body{ background: radial-gradient(circle at 10% 5%, rgba(25,118,210,.06), transparent 45%), radial-gradient(circle at 90% 90%, rgba(32,201,151,.07), transparent 45%), #F5FAFF; }
  .brand-mark{ background:linear-gradient(90deg,#123B6D,#20C997); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card{ background:#FFFFFF; border:1px solid #E7EEF7; border-radius:16px; box-shadow:0 2px 8px rgba(18,59,109,.04); transition:.2s; }
  .card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(18,59,109,.08); }
  .card.unread{ border-left:3px solid #1976D2; background:#F9FCFF; }
  .top-nav{ position:sticky; top:0; z-index:40; background:rgba(245,250,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid #E7EEF7; }
  .nav-link{ font-size:13px; font-weight:700; color:#64748B; text-decoration:none; padding:8px 14px; border-radius:10px; transition:.15s; }
  .nav-link:hover{ background:#E4F1FF; color:#1976D2; }
  .nav-link.active{ background:#1976D2; color:#fff; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .fade-up{ animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  .sev-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:4px; }
</style>
</head>
<body class="bg-bg text-ink font-sans m-0 min-h-screen pb-16">

<nav class="top-nav">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-3 flex items-center justify-between">
    <a href="events.html" class="flex items-center gap-2.5 no-underline">
      <img src="/assets/vyavastha-icon.png" alt="VYAVASTHA" class="w-9 h-9 rounded-lg" />
      <span class="brand-mark text-lg font-extrabold tracking-[0.02em]">VYAVASTHA</span>
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="events.html" class="nav-link">Home</a>
      <a href="events.html?explore=1" class="nav-link">Explore</a>
      <a href="my-events.html" class="nav-link">My Events</a>
      <a href="notifications.html" class="nav-link active">Alerts</a>
      <a href="attendee.html" class="nav-link">Live Status</a>
    </div>
    <a href="profile.html" class="w-9 h-9 rounded-full flex items-center justify-center text-lg" style="background:#E4F1FF;">👤</a>
  </div>
</nav>

<header class="max-w-4xl mx-auto px-6 lg:px-10 pt-8 fade-up">
  <h1 class="text-2xl font-extrabold m-0">Notifications</h1>
  <p class="text-muted text-sm mt-1">Gate, transport, and safety alerts for your events.</p>
</header>

<section id="notif-list" class="max-w-4xl mx-auto px-6 lg:px-10 mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4"></section>

<script>
const API = "";
async function api(path, opts) { const res = await fetch(API + path, opts); return res.json(); }

const SEVERITY = {
  CRITICAL: { color: "#DC2626", icon: "🔴" }, HIGH: { color: "#F87171", icon: "🟠" },
  MEDIUM: { color: "#F59E0B", icon: "🟡" }, LOW: { color: "#22C55E", icon: "🟢" },
};

function timeAgo(iso) {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return new Date(iso).toDateString();
}

function notifCard(n, i) {
  const sev = SEVERITY[n.priority] || SEVERITY.MEDIUM;
  return `
    <div class="card p-4 flex gap-3 fade-up ${n.is_read ? "" : "unread"}" style="animation-delay:${Math.min(i * 0.04, 0.3)}s" onclick='markRead(${n.id})'>
      <span class="sev-dot" style="background:${sev.color}"></span>
      <div class="flex-1">
        <div class="font-bold text-sm">${sev.icon} ${n.title}</div>
        <div class="text-sm mt-0.5">${n.message}</div>
        <div class="text-muted text-[10px] font-mono mt-1">${timeAgo(n.created_at)}</div>
      </div>
    </div>`;
}

async function markRead(id) { await api(`/api/notifications/${id}/read`, { method: "POST" }); load(); }

async function load() {
  const list = await api("/api/notifications?role=Attendee");
  document.getElementById("notif-list").innerHTML = list.length
    ? list.map(notifCard).join("")
    : `<div class="text-center text-muted text-xs py-16 col-span-full">No notifications yet — you'll see gate, transport, and safety alerts here once an event is live.</div>`;
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
