<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VYAVASTHA — Database Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF7F4; --surface:#FFFFFF; --card:#FFFFFF; --border:#E2E8F0;
    --accent:#1976D2; --text:#123B6D; --muted:#64748B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif;
    padding:24px; min-height:100vh;
  }
  h1{ font-size:16px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:12px; font-family:'JetBrains Mono',monospace; margin:0 0 24px; }
  .table-block{ background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:20px; overflow:hidden; box-shadow:0 1px 2px rgba(18,59,109,.04); }
  .table-head{ display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
  .table-name{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--accent); }
  .row-count{ font-size:10.5px; color:var(--muted); background:rgba(25,118,210,.08); border:1px solid rgba(25,118,210,.25); border-radius:20px; padding:2px 9px; }
  .scroll-wrap{ overflow-x:auto; }
  table{ border-collapse:collapse; width:100%; font-size:12.5px; font-family:'JetBrains Mono',monospace; white-space:nowrap; }
  th{ text-align:left; padding:8px 14px; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card); }
  td{ padding:7px 14px; border-bottom:1px solid rgba(226,232,240,.8); color:var(--text); }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:rgba(25,118,210,.05); }
  .null{ color:var(--muted); font-style:italic; }
  .empty{ padding:16px; color:var(--muted); font-size:12px; }
  .refresh{ background:var(--card); border:1px solid var(--border); color:var(--text); font-family:'Manrope',sans-serif; font-size:11px; font-weight:700; letter-spacing:.05em; padding:8px 14px; border-radius:8px; cursor:pointer; }
  .refresh:hover{ border-color:var(--accent); }
  .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
</style>
</head>
<body>
<div class="top-row">
  <div>
    <h1>VYAVASTHA — Database Tables</h1>
    <p class="sub">Raw contents of backend/vyavastha.db · debug view, not a real screen</p>
  </div>
  <button class="refresh" onclick="load()">↻ REFRESH</button>
</div>
<div id="tables"></div>

<script>
function renderValue(v) {
  if (v === null || v === undefined) return '<span class="null">null</span>';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  return String(v);
}

async function load() {
  const res = await fetch('/api/admin/raw-tables');
  const data = await res.json();
  const container = document.getElementById('tables');
  container.innerHTML = Object.entries(data).map(([name, t]) => `
    <div class="table-block">
      <div class="table-head">
        <span class="table-name">${name}</span>
        <span class="row-count">${t.rows.length} row${t.rows.length === 1 ? '' : 's'}</span>
      </div>
      ${t.rows.length === 0
        ? `<div class="empty">empty</div>`
        : `<div class="scroll-wrap"><table>
            <thead><tr>${t.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead>
            <tbody>${t.rows.map(row => `<tr>${t.columns.map(c => `<td>${renderValue(row[c])}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div>`}
    </div>
  `).join('');
}

load();
</script>
</body>
</html>
